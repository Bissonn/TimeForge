# =========================================================================================
# MASTER THESIS: EXPERIMENT 2 - SEQUENCE LENGTH DEGRADATION & GRADIENT FLOW
# =========================================================================================
# Main Goal: Investigate how sequence length (window_size) and forecasting horizon 
#            (forecast_steps) affect model performance, gradient stability (vanishing/
#            exploding gradients), and attention distributions.
# Key Comparisons:
#   - Direct vs. Iterative forecasting strategies (LSTM).
#   - Recurrent models (LSTM) vs. Attention-based models (Transformer) over long contexts.
#   - ML models vs. Classical baselines (SARIMA, Naive).
# Horizons tested: 24, 96, 192
# Windows tested: 96, 336, 720, 1440
# =========================================================================================

datasets:
  ETTh1:
    path: "data/ETTh1.csv"
    columns: ["OT"]           # Univariate forecasting for this specific experiment
    freq: "h"

models:
  # =========================================================
  # 1. NAIVE BASELINE
  # =========================================================
  seasonal_naive_24:
    type: "simple_seasonal"
    seasonal_period: 24       # Repeats the pattern from the last 24 hours

  # =========================================================
  # 2. DEEP LEARNING MODELS
  # =========================================================
  
  # LSTM - Direct Strategy (Outputs all forecast steps at once)
  lstm_direct:
    type: "lstm"
    strategy: "direct"
    batch_size: 128
    hidden_size: 128
    num_layers: 2
    dropout: 0.1
    max_grad_norm: 1.0

    # Gradient monitoring enabled to study vanishing/exploding gradients
    gradient_monitor:
      enabled: true
      log_dir: "results/gradients"
      log_interval: 50

    preprocessing:
      preprocessing_groups:
        - name: "scaling"
          apply_to: "__targets__"
          pipeline:
            scaling:
              enabled: true
              method: "standard"
    optimization:
      method: "optuna"
      n_trials: 30
      pruner_config:
        type: "percentile"
        percentile: 25.0
        n_startup_trials: 5
        n_warmup_steps: 3
      params:
        learning_rate: {min: 0.0001, max: 0.05, log: true}

  # LSTM - Iterative Strategy (Autoregressive - feeds output back as input)
  # Expected behavior: Severe error accumulation for long horizons (e.g., 192 steps)
  lstm_iterative:
    type: "lstm"
    strategy: "iterative"
    batch_size: 128
    hidden_size: 128
    num_layers: 2
    dropout: 0.1
    max_grad_norm: 1.0

    gradient_monitor:
      enabled: true
      log_dir: "results/gradients"
      log_interval: 50

    preprocessing:
      preprocessing_groups:
        - name: "scaling"
          apply_to: "__targets__"
          pipeline:
            scaling:
              enabled: true
              method: "standard"
    optimization:
      method: "optuna"
      n_trials: 30
      pruner_config:
        type: "percentile"
        percentile: 25.0
        n_startup_trials: 5
        n_warmup_steps: 3
      params:
        learning_rate: {min: 0.0001, max: 0.05, log: true}

  # Transformer - Encoder Only (Direct Strategy)
  # Expected behavior: Better long-range dependency handling, but quadratic memory cost
  transformer_enc_only_direct:
    type: "transformer"
    architecture: "encoder-only"
    strategy: "direct"
    batch_size: 128
    hidden_size: 128
    num_heads: 4
    num_encoder_layers: 2
    dropout: 0.1
    use_revin: false          # Disabled for a fair baseline comparison with LSTM

    gradient_monitor:
      enabled: true
      log_dir: "results/gradients"
      log_interval: 50

    # Attention capture enabled to visualize where the model focuses on long sequences
    attention_capture:
      enabled: true
      log_dir: "results/attention"

    preprocessing:
      preprocessing_groups:
        - name: "scaling"
          apply_to: "__targets__"
          pipeline:
            scaling:
              enabled: true
              method: "standard"

    optimization:
      method: "optuna"
      n_trials: 30
      pruner_config:
        type: "percentile"
        percentile: 25.0
        n_startup_trials: 5
        n_warmup_steps: 3
      params:
        learning_rate: {min: 0.0001, max: 0.05, log: true}

  # =========================================================
  # 3. STATISTICAL BASELINE
  # =========================================================
  # WARNING: Running HPO (30 trials) with 3 Folds on SARIMA for 
  # large window sizes (720, 1440) will be computationally massive.
  # Consider reducing n_trials or n_folds if execution takes too long.
  sarima:
    type: "sarima"
    seasonal_period: 24
    p: 1
    d: 1
    q: 1
    P: 1
    D: 1
    Q: 1
    use_exogenous: false
    enforce_stationarity: false
    enforce_invertibility: true
    method: "lbfgs"
    maxiter: 50

    preprocessing:
      preprocessing_groups:
        - name: "scaling"
          apply_to: "__targets__"
          pipeline:
            scaling:
              enabled: true
              method: "standard"
    optimize: true
    optimization:
      method: "optuna"
      n_trials: 30
      params:
        trend: ["n", "c"]
        p: {min: 0, max: 3}
        d: {min: 0, max: 1}
        q: {min: 0, max: 3}
        P: {min: 0, max: 1}
        D: {min: 0, max: 1}
        Q: {min: 0, max: 1}

experiments:
  # =========================================================
  # ALL EXPERIMENTS (Gradient & Attention Flow, SARIMA, SN)
  # =========================================================
  
  # --- Horizon 24 ---
  - name: "run_w96_24"
    dataset: "ETTh1"
    models:
      - name: "lstm_direct"
      - name: "lstm_iterative"
      - name: "transformer_enc_only_direct"
      - name: "sarima"
      - name: "seasonal_naive_24"
