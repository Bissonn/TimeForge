    strategy: "direct"
    use_exogenous: true
    use_revin: false          
    batch_size: 128           
    hidden_size: 256          # Result taken from HPO for w336
    num_heads: 4              
    num_encoder_layers: 2     
    dim_ff_multiplier: 4.0
    weight_decay: 0.0001
    dropout: 0.3
    epochs: 50                
    min_epochs: 10
