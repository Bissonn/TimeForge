  # =======================================================================================
  # [PHASE 3] REFERENCE MODELS (BASELINES)
  # Models serving as a statistical baseline for Machine Learning models.
  # =======================================================================================
  
  # 1. Classical Vector Autoregression model
  var:
    type: "var"
    enforce_stationarity: false
    enforce_invertibility: false
    max_lags: 1
    preprocessing:
      preprocessing_groups:
        - name: "default_target_pipeline"
          apply_to: "__targets__"
          pipeline:
            scaling: { enabled: true, method: "standard" }
    maxiter: 100
    optimize: true
    optimization:
      method: "optuna"
      n_trials: 50
      params:
        trend: ["n", "c", "ct"]

  # 2. Seasonal naive model (copies data from yesterday)
  seasonal_naive_24:
    type: "simple_seasonal"
    seasonal_period: 24       # Copies the pattern from the last 24 hours

# =======================================================================================
# EXPERIMENT DEFINITIONS
# Here we pair models with corresponding input windows and perform cross-validation.
# =======================================================================================
experiments:
  
  # --- HPO ARCHITECTURE SEARCH ---
  - name: "trans_hpo_baseline_w96"
    description: "Investigation of the optimal model structure for window 96"
    dataset: "etth1_multivar"
    models:
      - name: "trans_hpo_baseline"
    validation_setup:
      window_size: 96
      forecast_steps: 96
      n_folds: 3
      evaluation_metric: "mse"

  - name: "trans_hpo_baseline_w336"
    description: "Investigation of the optimal model structure for window 336"
    dataset: "etth1_multivar"
    models:
      - name: "trans_hpo_baseline"
    validation_setup:
      window_size: 336
      forecast_steps: 96
      n_folds: 3              
      evaluation_metric: "mse"

  - name: "trans_hpo_baseline_w720"
    description: "Investigation of the optimal model structure for window 720"
    dataset: "etth1_multivar"
    models:
      - name: "trans_hpo_baseline"
    validation_setup:
      window_size: 720
      forecast_steps: 96
      n_folds: 3
      evaluation_metric: "mse"

  - name: "trans_hpo_baseline_w1440"
    description: "Investigation of the optimal model structure for window 1440"
    dataset: "etth1_multivar"
    models:
      - name: "trans_hpo_baseline"
    validation_setup:
      window_size: 1440
      forecast_steps: 96
      n_folds: 3
      evaluation_metric: "mse"

  # --- NORMALIZATION COMPARATIVE TESTS (MAIN EXPERIMENT) ---
  - name: "run_w96"
    description: "Comparison of SS, RevIN, R2IN, and baseline models for Window 96"
    dataset: "etth1_multivar"
    models:
      - name: "trans_no_revin_w96"
