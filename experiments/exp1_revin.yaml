# =========================================================================================
# MASTER THESIS: EXPERIMENT 1 - NORMALIZATION STRATEGIES & WINDOW SIZES
# =========================================================================================
# Main Goal: Comparison of the impact of different data normalization methods (None, RevIN, Robust RevIN)
#            on the performance of the Transformer model in time series forecasting.
# Fixed assumptions: 
#   - Forecast horizon (forecast_steps) = 96 steps
#   - Variable input window sizes (window_size) = 96, 336, 720, 1440
# Methodology:
#   1. trans_hpo_baseline is used to find the optimal `hidden_size` parameter.
#   2. The found `hidden_size` is "frozen" and passed to the test models.
#   3. We evaluate ML models against classical methods (VAR, Seasonal Naive).
# =========================================================================================

logging:
  level: "INFO"

datasets:
  etth1_multivar:
    path: "data/ETTh1.csv"
    columns: ["OT", "HUFL", "HULL", "MUFL", "MULL", "LUFL", "LULL"]
    freq: "h"
    time_features: ["hour", "day_of_week", "day_of_year"]
    past_covariates: [
      "hour_sin", "hour_cos",
      "day_of_week_sin", "day_of_week_cos",
      "day_of_year_sin", "day_of_year_cos"
    ]

models:
  # =======================================================================================
  # [PHASE 1] BASELINE MODEL FOR OPTIMIZATION (HPO)
  # Goal: Find the optimal model capacity (hidden_size) for the Transformer architecture.
  # The result of this search will serve as the foundation for all subsequent models.
  # =======================================================================================
  trans_hpo_baseline:
    type: "transformer"
    architecture: "encoder-only"
    strategy: "direct"

    # --- Fixed configuration ---
    use_exogenous: true
    use_revin: false          # Optimizing the "clean" architecture, based on StandardScaler
    batch_size: 128           
    num_heads: 4              
    num_encoder_layers: 2     # Shallow models often perform better in Time Series
    dim_ff_multiplier: 4.0
    weight_decay: 0.0001
    epochs: 25
    min_epochs: 10
    early_stopping_patience: 6
    learning_rate: 0.0005
    scheduler_config:
      type: "onecycle"
      pct_start: 0.3            
      div_factor: 100.0         
      final_div_factor: 10000.0 
      anneal_strategy: "cos"    

    # Preprocessing
    preprocessing:
      preprocessing_groups:
        - name: "default_target_pipeline"
          apply_to: "__targets__"
          pipeline:
            scaling: { enabled: true, method: "standard" } # Classical normalization for the baseline

    # --- HPO CONFIGURATION (OPTUNA) ---
    optimize: true
    optimization:
      method: "optuna"
      n_trials: 50
      pruner_config:
        type: "percentile"
        percentile: 25.0
        n_startup_trials: 10
        n_warmup_steps: 10
      params:
        hidden_size: [64, 128, 256, 512]       # The main parameter searched for in this phase
        dropout: [0.1, 0.2, 0.3]
        learning_rate: {min: 0.0001, max: 0.05, log: true}
        scheduler_config:
          pct_start: {min: 0.2, max: 0.5, step: 0.1}
          final_div_factor: [1000.0, 10000.0]

  # =======================================================================================
  # [PHASE 2] TEST MODELS (FROZEN ARCHITECTURE)
  # The models below inherit the optimal 'hidden_size' found in the HPO phase.
  # We focus exclusively on optimizing the Learning Rate (LR) for different windows (96-1440)
  # and comparing the impact of RevIN / Robust RevIN mechanisms.
  # =======================================================================================

  # ---------------------------------------------------------
  # STRATEGY 1: STANDARD SCALER (NO REVIN)
  # ---------------------------------------------------------
  trans_no_revin_w96:
    type: "transformer"
    architecture: "encoder-only"
    strategy: "direct"
    use_exogenous: true
    use_revin: false          
    batch_size: 128           
    hidden_size: 64           # Result taken from HPO
    num_heads: 4              
    num_encoder_layers: 2     
    dim_ff_multiplier: 4.0
    weight_decay: 0.0001
    dropout: 0.2
    epochs: 50                
    min_epochs: 10
    early_stopping_patience: 25
    learning_rate: 0.0001
    scheduler_config:
      type: "onecycle"
      pct_start: 0.3             
      div_factor: 100.0          
      final_div_factor: 10000.0  
      anneal_strategy: "cos"     
    preprocessing:
      preprocessing_groups:
        - name: "default_target_pipeline"
          apply_to: "__targets__"
          pipeline:
            scaling: { enabled: true, method: "standard" } # Standard Scaler enabled
    optimize: true
    optimization:
      method: "optuna"
      n_trials: 30
      pruner_config:
        type: "percentile"
        percentile: 50.0       
        n_startup_trials: 5    
        n_warmup_steps: 10     
        n_min_trials: 5        
      params:
        learning_rate: {min: 0.0001, max: 0.02, log: true}
        scheduler_config:
          pct_start: {min: 0.2, max: 0.5, step: 0.1}
          final_div_factor: [1000.0, 10000.0]

  trans_no_revin_w336:
