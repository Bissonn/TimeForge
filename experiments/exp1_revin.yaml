  # ---------------------------------------------------------
  # STRATEGY 2: STANDARD REVIN (NO STANDARD SCALER)
  # ---------------------------------------------------------
  trans_revin_w96:
    type: "transformer"
    architecture: "encoder-only"
    strategy: "direct"
    use_exogenous: true
    use_revin: true           # Activation of the Reversible Instance Normalization mechanism
    batch_size: 128           
    hidden_size: 64           # Result taken from HPO for w96
