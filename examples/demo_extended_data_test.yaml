# ============================================================================
# Extended Dataset Test - Weekend Data Hypothesis Verification
# ============================================================================
# Purpose: Test if more weekend training data reduces fold shift
# Hypothesis: With 5 years (~260 weekends) vs 2 years (~104 weekends),
#             temporal shift on weekend folds should decrease
# ============================================================================

paths:
  model_save_path_template: "results/models/{model_name}_{dataset_name}.pkl"

logging:
  level: "INFO"

datasets:
  demo_energy_5yr:
    path: "data/demo_energy_demand_5yr.csv"
    columns: ["energy_demand"]
    freq: "h"

    past_covariates:
      - "temperature"
      - "humidity"
      - "wind_speed"

    future_covariates:
      - "is_weekend"
      - "is_business_hours"

models:
  # ------------------------------------------------------------------------
  # Baseline: last_value initialization (from original test)
  # ------------------------------------------------------------------------
  transformer_last_value_5yr:
    type: "transformer"
    architecture: "encoder-decoder"
    strategy: "iterative"

    hidden_size: 128
    num_heads: 8
    num_encoder_layers: 3
    num_decoder_layers: 2
    dim_ff_multiplier: 4.0
    dropout: 0.1

    tgt_init: "last_value"  # Baseline

    auxiliary_loss:
      enabled: true
      weight: 0.15

    epochs: 20
    batch_size: 32
    learning_rate: 0.001
    optimizer: "adam"
    loss: "mse"

    early_stopping_patience: 10

    preprocessing:
      preprocessing_groups:
        - name: "scaling"
          apply_to: "__targets__"
          pipeline:
            scaling:
              enabled: true
              method: "standard"

    use_exogenous: true
    optimize: false

  # ------------------------------------------------------------------------
  # Test 1: Daily cycle (seasonal_period=24)
  # ------------------------------------------------------------------------
  transformer_seasonal_24h_5yr:
    type: "transformer"
    architecture: "encoder-decoder"
    strategy: "iterative"

    hidden_size: 128
    num_heads: 8
    num_encoder_layers: 3
    num_decoder_layers: 2
    dim_ff_multiplier: 4.0
    dropout: 0.1

    tgt_init: "seasonal"
    seasonal_period: 24  # Daily cycle

    auxiliary_loss:
      enabled: true
      weight: 0.15

    epochs: 20
    batch_size: 32
    learning_rate: 0.001
    optimizer: "adam"
    loss: "mse"

    early_stopping_patience: 10

    preprocessing:
      preprocessing_groups:
        - name: "scaling"
          apply_to: "__targets__"
          pipeline:
            scaling:
              enabled: true
              method: "standard"

    use_exogenous: true
    optimize: false

  # ------------------------------------------------------------------------
  # Test 2: Weekly cycle (seasonal_period=168)
  # ------------------------------------------------------------------------
  transformer_seasonal_168h_5yr:
    type: "transformer"
    architecture: "encoder-decoder"
    strategy: "iterative"

    hidden_size: 128
    num_heads: 8
    num_encoder_layers: 3
    num_decoder_layers: 2
    dim_ff_multiplier: 4.0
    dropout: 0.1

    tgt_init: "seasonal"
    seasonal_period: 168  # Weekly cycle

    auxiliary_loss:
      enabled: true
      weight: 0.15

    epochs: 20
    batch_size: 32
    learning_rate: 0.001
    optimizer: "adam"
    loss: "mse"

    early_stopping_patience: 10

    preprocessing:
      preprocessing_groups:
        - name: "scaling"
          apply_to: "__targets__"
          pipeline:
            scaling:
              enabled: true
              method: "standard"

    use_exogenous: true
    optimize: false

experiments:
  - name: "demo_extended_5yr_test"
    dataset: "demo_energy_5yr"
    models:
      - "transformer_last_value_5yr"
      - "transformer_seasonal_24h_5yr"
      - "transformer_seasonal_168h_5yr"
    validation_setup:
      forecast_steps: 24  # 1 day ahead
      n_folds: 3
      window_size: 168  # 1 week of history
      evaluation_metric: "mse"
      early_stopping_validation_percentage: 15  # For HPO mode only

# ============================================================================
# HYPOTHESIS VERIFICATION
# ============================================================================
#
# Comparison: 2-year dataset vs 5-year dataset
#
# Original dataset (2 years):
# - Total hours: 17,520
# - Weekend days: ~104
# - Training split: ~70% → ~73 weekend days
#
# Extended dataset (5 years):
# - Total hours: 43,800 (2.5x more)
# - Weekend days: ~260 (2.5x more)
# - Training split: ~70% → ~182 weekend days (2.5x more)
#
# Expected improvements IF hypothesis is correct:
# 1. Lower MAE on weekend folds (Fold 2, potentially Fold 3)
# 2. Reduced temporal shift on weekend folds
# 3. Better weekend pattern learning (lower variance in predictions)
#
# Expected results IF hypothesis is INCORRECT:
# 1. Similar MAE on weekend folds
# 2. Similar temporal shift patterns
# 3. No significant improvement on weekend predictions
#
# Key metrics to compare:
# - Fold 2 MAE (Saturday) - Original: 10.04-14.23
# - Fold 2 shift (Saturday) - Original: -4h to -5h
# - Fold 3 MAE (Sunday/NYE) - Original: 3.81-10.06
# - Overall MAE - Original best: 5.59 (seasonal_24h)
#
# ============================================================================
