[pytest]
pythonpath = .
testpaths = tests
addopts = -v --tb=short
markers =
    unit: mark a test as a unit test.
    integration: mark a test as an integration test.
filterwarnings =
    ignore:Maximum Likelihood optimization failed to converge.*:statsmodels.tools.sm_exceptions.ConvergenceWarning
    ignore:Maximum Likelihood optimization failed to converge.*:UserWarning
    ignore:.*enable_nested_tensor is True, but self.use_nested_tensor is False.*:UserWarning
    ignore:Non-stationary starting autoregressive parameters found.*:UserWarning
    ignore:The argument 'device' of Tensor.pin_memory\(\) is deprecated.*:DeprecationWarning
    ignore:The argument 'device' of Tensor.is_pinned\(\) is deprecated.*:DeprecationWarning